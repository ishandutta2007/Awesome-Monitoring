<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 56px;
      fill: url(#text-grad);
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 22px;
      fill: #94a3b8;
      letter-spacing: 1.5px;
    }
    .wave {
      fill: none;
      stroke-width: 3;
      stroke-linecap: round;
    }
    .pulse-dot {
      animation: pulse 2s infinite alternate;
    }
    @keyframes pulse {
      0% { r: 4px; opacity: 0.6; }
      100% { r: 8px; opacity: 1; }
    }
    .grid-line {
      stroke: #334155;
      stroke-width: 1;
      stroke-dasharray: 4 4;
      opacity: 0.4;
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bg)" rx="12" />

  <!-- Background Grid Lines -->
  <line x1="100" y1="0" x2="100" y2="300" class="grid-line" />
  <line x1="300" y1="0" x2="300" y2="300" class="grid-line" />
  <line x1="500" y1="0" x2="500" y2="300" class="grid-line" />
  <line x1="700" y1="0" x2="700" y2="300" class="grid-line" />
  <line x1="900" y1="0" x2="900" y2="300" class="grid-line" />
  <line x1="1100" y1="0" x2="1100" y2="300" class="grid-line" />

  <line x1="0" y1="60" x2="1200" y2="60" class="grid-line" />
  <line x1="0" y1="150" x2="1200" y2="150" class="grid-line" />
  <line x1="0" y1="240" x2="1200" y2="240" class="grid-line" />

  <!-- Dynamic Waveforms / Metrics Lines (Background decorative elements) -->
  <path class="wave" stroke="url(#line-grad)" opacity="0.3" d="M 0,220 Q 150,180 300,240 T 600,190 T 900,230 T 1200,180" />
  
  <path class="wave" stroke="#38bdf8" stroke-width="2" opacity="0.5" filter="url(#glow)" d="M 0,250 C 150,250 200,210 350,210 C 500,210 550,260 700,240 C 850,220 950,270 1200,220" />
  <path class="wave" stroke="#818cf8" stroke-width="3" opacity="0.7" filter="url(#glow)" d="M 0,210 C 180,210 250,270 400,230 C 550,190 650,250 800,210 C 950,170 1050,240 1200,200" />
  
  <!-- Active Pulse Graph Line -->
  <path class="wave" stroke="#38bdf8" stroke-width="3" d="M 50,230 L 200,230 L 230,170 L 260,260 L 290,210 L 320,230 L 550,230 L 580,140 L 610,270 L 640,190 L 670,230 L 900,230 L 930,160 L 960,250 L 990,230 L 1150,230" />

  <!-- Glowing Pulse Nodes -->
  <circle cx="230" cy="170" r="5" fill="#38bdf8" class="pulse-dot" filter="url(#glow)" />
  <circle cx="580" cy="140" r="6" fill="#818cf8" class="pulse-dot" filter="url(#glow)" />
  <circle cx="930" cy="160" r="5" fill="#c084fc" class="pulse-dot" filter="url(#glow)" />

  <!-- Foreground Title and Subtitle -->
  <g transform="translate(600, 115)" text-anchor="middle">
    <!-- Outer Glow for text readability -->
    <text class="title" x="0" y="0" stroke="#0f172a" stroke-width="8" stroke-linejoin="round">Awesome Monitoring &amp; Observability 📊</text>
    <text class="title" x="0" y="0">Awesome Monitoring &amp; Observability 📊</text>
    
    <text class="subtitle" x="0" y="45" fill="#e2e8f0" font-weight="600">A Curated Ecosystem of APM, Metrics, Logs, Traces &amp; Alerting Tools</text>
  </g>
</svg>
